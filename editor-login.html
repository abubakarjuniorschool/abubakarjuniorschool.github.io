<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor Login | Abubakar Junior School</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f9;
        color: #222;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .login-card {
        background: white;
        width: min(400px, 100%);
        padding: 35px 30px;
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        text-align: center;
    }

    .badge {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: #0756a8;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        margin: 0 auto 15px;
        font-size: 15px;
    }

    .login-card h1 {
        font-size: 19px;
        color: #0756a8;
        margin-bottom: 6px;
    }

    .login-card h2 {
        font-size: 14px;
        color: #777;
        font-weight: normal;
        margin-bottom: 25px;
    }

    .field {
        text-align: left;
        margin-bottom: 16px;
    }

    .field label {
        display: block;
        font-weight: bold;
        font-size: 13px;
        margin-bottom: 6px;
        color: #333;
    }

    .field input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
    }

    .field input:focus {
        outline: none;
        border-color: #0756a8;
        box-shadow: 0 0 0 2px rgba(7,86,168,0.08);
    }

    .login-btn {
        width: 100%;
        background: #0756a8;
        color: white;
        border: none;
        padding: 13px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        font-size: 15px;
        margin-top: 6px;
    }

    .login-btn:hover {
        background: #06437f;
    }

    .login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    #loginError {
        display: none;
        background: #fdecec;
        color: #a51c30;
        border: 1px solid #f2c0c7;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 16px;
    }

    .back-link {
        display: inline-block;
        margin-top: 20px;
        font-size: 13px;
        color: #0756a8;
        text-decoration: none;
    }

    .back-link:hover {
        text-decoration: underline;
    }

    .note {
        margin-top: 18px;
        font-size: 12px;
        color: #999;
    }

</style>

</head>
<body>

<div class="login-card">

    <div class="badge">AJS</div>

    <h1>Abubakar Junior School</h1>
    <h2>Editor Login</h2>

    <div id="loginError">❌ Incorrect editor email or password.</div>

    <form id="loginForm">

        <div class="field">
            <label for="editorEmail">Editor Email</label>
            <input type="email" id="editorEmail" required autocomplete="username">
        </div>

        <div class="field">
            <label for="editorPassword">Password</label>
            <input type="password" id="editorPassword" required autocomplete="current-password">
        </div>

        <button class="login-btn" type="submit" id="loginBtn">LOGIN TO EDITOR</button>

    </form>

    <a class="back-link" href="index.html">← Back to School Website</a>

    <p class="note">Authorized school editors only.</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPABASE_URL = "https://ggthkvlynzgslzdqnymo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_G_h5jXptFUfDRwAf2XIA8w_Vf97C82l";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// If already logged in, skip straight to the dashboard
(async function redirectIfLoggedIn() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
        window.location.href = "editor-dashboard.html";
    }
})();

document.getElementById("loginForm").addEventListener("submit", async function (e) {

    e.preventDefault();

    const email = document.getElementById("editorEmail").value.trim();
    const password = document.getElementById("editorPassword").value;
    const errorBox = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");

    errorBox.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Logging in...";

    const { error } = await sb.auth.signInWithPassword({ email, password });

    btn.disabled = false;
    btn.textContent = "LOGIN TO EDITOR";

    if (error) {
        errorBox.style.display = "block";
        return;
    }

    window.location.href = "editor-dashboard.html";

});

</script>

</body>
</html>
