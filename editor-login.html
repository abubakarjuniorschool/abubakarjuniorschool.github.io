<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editor Login | Abubakar Junior School</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0756a8, #043b73);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0756a8;
            color: white;

            border-radius: 50%;

            font-size: 22px;
            font-weight: bold;
        }

        .logo h1 {
            color: #0756a8;
            font-size: 24px;
            margin-bottom: 6px;
        }

        .logo p {
            color: #777;
            font-size: 14px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .field input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d8d8d8;
            border-radius: 9px;
            font-size: 15px;
            font-family: inherit;
        }

        .field input:focus {
            outline: none;
            border-color: #0756a8;
            box-shadow: 0 0 0 3px rgba(7,86,168,0.1);
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #0756a8;
            color: white;
            padding: 13px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #06437f;
        }

        .error-message {
            display: none;
            background: #ffe6ea;
            color: #b00320;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0756a8;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 18px;
            text-align: center;
            color: #888;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 25px 20px;
            }

        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">

            <div class="logo-icon">
                AJS
            </div>

            <h1>
                Abubakar Junior School
            </h1>

            <p>
                Editor Login
            </p>

        </div>


        <div
            class="error-message"
            id="errorMessage">

            ❌ Incorrect editor name or password.

        </div>


        <form onsubmit="loginEditor(event)">

            <div class="field">

                <label for="editorName">
                    Editor Name
                </label>

                <input
                    type="text"
                    id="editorName"
                    placeholder="Enter editor name"
                    autocomplete="username"
                    required>

            </div>


            <div class="field">

                <label for="editorPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="editorPassword"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                class="login-btn">

                LOGIN TO EDITOR

            </button>

        </form>


                
            href="index.html"
            class="back-link">

            ← Back to School Website

        </a>

        <div class="security-note">

            Authorized school editors only.

        </div>

    </div>

</div>


<script>

function loginEditor(event) {

    event.preventDefault();


    const name =
        document
            .getElementById("editorName")
            .value
            .trim()
            .toUpperCase();


    const password =
        document
            .getElementById("editorPassword")
            .value;


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    /*
     * CURRENT EDITOR ACCOUNT
     */

    const correctName =
        "ABUBAKAR";


    const correctPassword =
        "AJS123456";


    /*
     * CHECK LOGIN
     */

    if (
        name === correctName &&
        password === correctPassword
    ) {

        sessionStorage.setItem(
            "editorLoggedIn",
            "true"
        );


        sessionStorage.setItem(
            "editorName",
            "ABUBAKAR"
        );


        /*
         * IMPORTANT:
         *
         * The actual dashboard file must be
         * saved as exactly:
         *
         * editor-dashboard.html
         */

        window.location.href =
            "editor-dashboard.html";

    }

    else {

        errorMessage.style.display =
            "block";


        document
            .getElementById(
                "editorPassword"
            )
            .value = "";


        document
            .getElementById(
                "editorPassword"
            )
            .focus();

    }

}

</script>

</body>
</html>
